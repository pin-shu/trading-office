<style>
:root{
  --bg1:#f3f1ec; --bg2:#e4ebe6; --panel:#ffffff; --line:#e6e8ec; --text:#1f2530; --muted:#7b8494; --soft:#f5f6f8;
  --green:#22c55e; --orange:#f59e0b; --grey:#a3aab5; --red:#ef4444;
  --radius:20px; --shadow:0 10px 30px rgba(31,37,48,.08), 0 2px 6px rgba(31,37,48,.05);
  --font: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--text);background:linear-gradient(180deg,var(--bg1),var(--bg2));-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;outline:none}
#overlay{position:fixed;inset:0;pointer-events:none;overflow:hidden}
button{font-family:inherit}
.bubble{position:absolute;left:0;top:0;transform-origin:50% 100%;pointer-events:auto;cursor:pointer;background:#fff;border-radius:14px;padding:6px 10px 7px;box-shadow:0 6px 16px rgba(31,37,48,.14);border:1px solid #eceef1;font-size:12px;line-height:1.35;white-space:nowrap;width:max-content;max-width:240px;will-change:transform;transition:opacity .25s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;border-right:1px solid #eceef1;border-bottom:1px solid #eceef1;transform:translateX(-50%) rotate(45deg);border-bottom-right-radius:3px}
.bubble .who{display:flex;align-items:center;gap:5px;font-weight:700;font-size:11px;color:#3b4250}
.bubble .who i{width:7px;height:7px;border-radius:50%;display:inline-block}
.bubble .who .st{margin-left:auto;font-weight:600;font-size:10px;padding:0 6px;border-radius:999px;background:var(--soft);color:var(--muted)}
.bubble .who .st.working{background:#dcfce7;color:#15803d}.bubble .who .st.waiting{background:#fef3c7;color:#b45309}
.bubble .msg{overflow:hidden;color:#1f2530;max-width:220px;white-space:normal;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;margin-top:1px}
.bubble.hidden{opacity:0;pointer-events:none}
.floortag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:12px;font-weight:600;display:flex;gap:7px;align-items:center;box-shadow:0 4px 12px rgba(31,37,48,.08);white-space:nowrap;transition:opacity .3s}
.floortag b{background:#2f3540;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.floortag.hidden{opacity:0;pointer-events:none}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);z-index:5}
#top{top:16px;left:50%;transform:translateX(-50%);border-radius:999px;display:flex;align-items:center;gap:14px;padding:8px 16px;font-size:13px;font-weight:600;white-space:nowrap}
#top .c{display:flex;align-items:center;gap:6px;color:#3b4250}
#top .c b{font-variant-numeric:tabular-nums;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--green);box-shadow:0 0 0 3px #dcfce7}.dot.o{background:var(--orange);box-shadow:0 0 0 3px #fef3c7}.dot.n{background:var(--grey);box-shadow:0 0 0 3px #eef0f3}
#top .sep{width:1px;height:18px;background:var(--line)}
#conn{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600}
#conn .dot{background:var(--grey)}#conn.live{color:#15803d}#conn.live .dot{background:var(--green);animation:pulse 1.8s infinite}
#conn.off{color:#b91c1c}#conn.off .dot{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
#clock{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.switch{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;user-select:none;font-weight:600}
.switch input{display:none}.switch span{width:30px;height:18px;border-radius:999px;background:#e5e7eb;position:relative;transition:.2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+span{background:#22c55e}.switch input:checked+span::after{left:14px}
#left{top:16px;left:16px;bottom:16px;width:300px;display:flex;flex-direction:column;overflow:hidden}
#left header{padding:18px 18px 10px}
#left h1{font-size:19px;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
#left h1 .dot{background:var(--green);animation:pulse 1.8s infinite}
#left .sub{margin-top:6px;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--soft);color:#59616f;border:1px solid var(--line)}
.chip.paper{background:#fff7e6;color:#b45309;border-color:#fde7c2}
.scroll{overflow:auto;padding:0 12px 14px;flex:1;scrollbar-width:thin}
.sect{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:12px 8px 6px}
.floor{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s}
.floor:hover{background:var(--soft)}
.floor.active{background:#f1f5ff;border-color:#dbe4ff}
.floor .lv{width:38px;height:28px;border-radius:9px;background:#2f3540;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.floor.all .lv{background:#e9ecf1;color:#2f3540}
.floor .nm{font-size:13px;font-weight:600;line-height:1.2}
.floor .who{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.floor .ds{margin-left:auto;display:flex;gap:5px}
.acc{border:1px solid var(--line);border-radius:16px;margin:10px 0 0;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 12px;font-size:13px;font-weight:700}
.acc summary::-webkit-details-marker{display:none}
.acc summary .n{margin-left:auto;font-size:11px;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 8px}
.acc summary .car{transition:transform .2s;color:var(--muted)}
.acc[open] summary .car{transform:rotate(90deg)}
.acc .body{padding:0 10px 10px}
.item{display:flex;gap:9px;align-items:flex-start;padding:8px 6px;border-top:1px solid #f0f1f4;font-size:12px;line-height:1.45}
.item:first-child{border-top:none}
.ic{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:800}
.ic.warn{background:#fff3db;color:#d97706}.ic.ok{background:#dcfce7;color:#16a34a}.ic.rt{background:#eef2ff;color:#4f46e5}.ic.ps{background:#f1f2f4;color:#8a929e}
.item .tx{flex:1;min-width:0}.item .tx b{font-weight:700}.item .tm{color:var(--muted);font-size:11px}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;color:#2f3540;flex:none}
.btn:hover{background:var(--soft)}
.empty{color:var(--muted);font-size:12px;padding:6px 6px 2px}
#right{top:16px;right:16px;bottom:16px;width:340px;display:flex;flex-direction:column;overflow:hidden}
#right .hd{padding:16px 18px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f1f4}
#right .hd h2{margin:0;font-size:15px}
#right .hd .x{margin-left:auto}
#rbody{overflow:auto;padding:12px 14px 16px;flex:1;scrollbar-width:thin}
.card{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;background:#fff}
.card .top{display:flex;gap:12px;align-items:center}
.av{width:42px;height:46px;border-radius:21px 21px 16px 16px;position:relative;flex:none;box-shadow:inset 0 -6px 10px rgba(0,0,0,.12)}
.av::before,.av::after{content:"";position:absolute;top:18px;width:5px;height:6px;border-radius:50%;background:#1d2330}
.av::before{left:14px}.av::after{right:14px}
.av.lightEyes::before,.av.lightEyes::after{background:#fff}
.card .nm{font-weight:700;font-size:15px}.card .rl{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.stat{margin-top:12px;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.45}
.stat .lb{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.mini{margin-top:10px}
.mini .ev{font-size:12px;padding:6px 0;border-top:1px dashed #eceef1;display:flex;gap:8px}
.mini .ev:first-child{border-top:none}.mini .ev .tm{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.chat{display:flex;flex-direction:column;gap:10px}
.msgrow{display:flex;gap:8px;align-items:flex-end}
.msgrow .sav{width:24px;height:26px;border-radius:12px 12px 9px 9px;flex:none}
.msgrow .bb{background:var(--soft);border-radius:16px 16px 16px 4px;padding:8px 11px;font-size:13px;line-height:1.45;max-width:250px;word-break:break-word}
.msgrow .meta{font-size:10.5px;color:var(--muted);margin-bottom:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.msgrow .meta b{color:#3b4250}
.act{font-size:10px;font-weight:700;border-radius:999px;padding:0 6px;background:#e9ecf1;color:#59616f}
.act.working{background:#dcfce7;color:#15803d}.act.handoff,.act.walk_to{background:#fef3c7;color:#b45309}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px;padding:0 2px}
#menuBtn,#infoBtn{display:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted);z-index:2}
@media (max-width: 900px){
  #top{top:10px;gap:9px;padding:7px 12px;font-size:12px;max-width:calc(100vw - 20px)}
  #top .hideS{display:none}
  #left{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:58vh;transform:translateY(calc(100% + 20px));transition:transform .3s ease}
  #left.open{transform:none}
  #right{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:55vh;transform:translateY(calc(100% + 20px));transition:transform .3s ease}
  #right.open{transform:none}
  #menuBtn,#infoBtn{display:flex;position:fixed;bottom:14px;z-index:6;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;align-items:center;gap:6px}
  #menuBtn{left:14px}#infoBtn{right:14px}
  .bubble{font-size:11px;max-width:170px}.bubble .msg{max-width:156px}
}
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading">載入 3D 大樓中…</div>
<div id="overlay"></div>
<div id="top" class="panel">
  <span class="c"><i class="dot g"></i>工作中 <b id="cW">0</b></span>
  <span class="c"><i class="dot o"></i>等待中 <b id="cA">0</b></span>
  <span class="c"><i class="dot n"></i>閒置 <b id="cI">0</b></span>
  <span class="sep"></span>
  <span id="conn" class="off"><i class="dot"></i><span id="connTx">連線中…</span></span>
  <span class="sep hideS"></span>
  <span id="clock" class="hideS"></span>
  <label class="switch hideS" title="整棟大樓檢視時，鏡頭跟著移動中的成員"><input type="checkbox" id="follow" checked><span></span>鏡頭跟隨</label>
</div>
<aside id="left" class="panel">
  <header>
    <h1><i class="dot"></i>交易團隊大樓</h1>
    <div class="sub"><span class="chip paper">PAPER 模擬交易</span><span class="chip">需你核准才執行</span></div>
  </header>
  <div class="scroll">
    <div class="sect">樓層</div>
    <div id="floors"></div>
    <details class="acc" open>
      <summary><span class="ic warn">!</span>等你決定<span class="n" id="nDecide">0</span><span class="car">›</span></summary>
      <div class="body" id="decide"></div>
    </details>
    <details class="acc">
      <summary><span class="ic ok">✓</span>已完成<span class="n" id="nDone">0</span><span class="car">›</span></summary>
      <div class="body" id="done"></div>
    </details>
    <details class="acc" open>
      <summary><span class="ic rt">↻</span>例行任務<span class="n">2</span><span class="car">›</span></summary>
      <div class="body">
        <div class="item"><span class="ic rt">↻</span><div class="tx"><b>各市場交易時段每小時掃描</b><div class="tm">加密 24 小時・台股 09:00–13:30・美股 22:30–05:00（台北）</div></div></div>
        <div class="item"><span class="ic ps">Ⅱ</span><div class="tx"><b>Solana 迷因幣監控</b><div class="tm">暫停中</div></div></div>
      </div>
    </details>
    <p class="note">畫面上的狀態與動態只顯示各 Bot 實際回報的內容。沒有新事件時，角色只做待機小動作，不代表任何交易。</p>
  </div>
</aside>
<aside id="right" class="panel">
  <div class="hd"><h2 id="rtitle">全部動態</h2><button class="btn x" id="rclose">整棟大樓</button></div>
  <div id="rbody"></div>
</aside>
<button id="menuBtn">☰ 樓層</button>
<button id="infoBtn">💬 動態</button>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------------- constants ---------------- */
const FH = 6, HW = 11, HD = 7, W = HW * 2, D = HD * 2, SLAB = 0.35;

/* ---------------- state / utils ---------------- */
let agentState = {}; let events = [];
const nameOf = (id) => agentState[id]?.name || AG[id]?.short || id;
const fmtT = new Intl.DateTimeFormat("zh-TW", { timeZone: "Asia/Taipei", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });

/* ---------------- fonts for canvas textures ---------------- */
const TEX_TEXT = "多空辯論BullvsBear董事長室交易團隊大樓即時狀態模擬模式PAPER總指揮加密分析股票分析風控稽核前台TingHe澍GrokBot迷因幣監控暫停中Solana單筆風險0.5%日損上限1%最多持倉3倉執行只做研究部台股美股時段大廳總部HQ1F2F3F4F15m1H4HSMCOI資金費率新聞—–:09:00–13:3022:30–05:00金庫核准提案待命工作中閒置前往交件尚無回報台北紐約時間看板檢查由你決定頂樓·績效回測模擬成交曝險回撤熱力圖訂單簿類股加權指數成交量歡迎光臨模擬交易團隊各成員最新回報（台北時間）S&P500ETHBTCSOL風控規則 / 7MARKETSWelcome影音工作室萌寵亂劇場PetChaosClub莉莉導演Shorts營運剪輯時間軸上片排程SEO標題縮圖素材收音5F錄製待上片重剪《減肥第一天》v2完成第支時間軸A分鏡素材收音調色字幕導演#萌寵Shorts標題/縮圖PETCHAOSCLUB";
await Promise.race([Promise.all([document.fonts.load('700 48px "Noto Sans TC"', TEX_TEXT), document.fonts.load('500 32px "Noto Sans TC"', TEX_TEXT), document.fonts.load('800 48px "Noto Sans TC"', TEX_TEXT)]).catch(() => {}), new Promise((r) => setTimeout(r, 3500))]);
const CFONT = '"Noto Sans TC", Inter, "PingFang TC", sans-serif';

/* ---------------- renderer / scene ---------------- */

function renderLists() {
  const pd = pendingDecisions(), dn = doneItems();
  document.getElementById("nDecide").textContent = pd.length; document.getElementById("nDone").textContent = dn.length;
  document.getElementById("decide").innerHTML = pd.length ? pd.map((e) => `<div class="item"><span class="ic warn">!</span><div class="tx"><b>${esc(e.message || e.status)}</b><div class="tm">${esc(AG[e.agent]?.short || e.agent)} → 澍・${tt(e.ts)}</div></div><button class="btn" data-a="${esc(e.agent)}">查看</button></div>`).join("") : `<div class="empty">目前沒有需要你決定的事項</div>`;
  document.getElementById("done").innerHTML = dn.length ? dn.map((d) => `<div class="item"><span class="ic ok">✓</span><div class="tx"><b>${esc(d.task)}</b><div class="tm">${esc(AG[d.agent]?.short || d.agent)}・${tt(d.ts)}</div></div></div>`).join("") : `<div class="empty">尚無完成紀錄</div>`;
  document.querySelectorAll("#decide .btn").forEach((b) => b.addEventListener("click", () => setView(AG[b.dataset.a]?.floor ?? "all", b.dataset.a)));
}
function avatar(id, cls = "av") { const a = AG[id]; return `<span class="${cls} ${id === "commander" ? "lightEyes" : ""}" style="background:${a.color}"></span>`; }
function profileCard(id) {
  const a = AG[id], s = agentState[id], c = chars[id];
  const st = c?.traveling ? (c.carrying ? "交件中" : "移動中") : ACTION_LABEL[s?.action] || "閒置";
  const k = c?.traveling || s?.action === "handoff" || s?.action === "walk_to" ? "o" : s?.action === "working" ? "g" : "n";
  const mine = events.filter((e) => e.agent === id || e.to === id).slice(-4).reverse();
  return `<div class="card"><div class="top">${avatar(id)}<div><div class="nm">${esc(nameOf(id))}</div><div class="rl">${esc(a.role)}</div></div></div>
  <div class="stat"><div class="lb"><i class="dot ${k}"></i>${st}${s?.updated ? "・" + tt(s.updated) : ""}</div>${esc(s?.status || "尚無回報")}</div>
  <div class="tags">${a.tags.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>
  ${mine.length ? `<div class="mini">${mine.map((e) => `<div class="ev"><span class="tm">${tt(e.ts).slice(-5)}</span><span>${esc(e.message || e.status)}</span></div>`).join("")}</div>` : ""}</div>`;
}
function chatLog(list) {
  if (!list.length) return `<div class="empty">尚無動態。各 Bot 回報後會即時出現在這裡。</div>`;
  return `<div class="chat">${list.slice(-40).reverse().map((e) => { const id = AG[e.agent] ? e.agent : "grokbot"; const to = e.to && AG[e.to] ? ` → ${esc(AG[e.to].short)}` : "";
    return `<div class="msgrow">${avatar(id, "sav")}<div><div class="meta"><b>${esc(AG[e.agent]?.short || e.agent)}</b>${to}<span class="act ${esc(e.action)}">${ACTION_LABEL[e.action] || esc(e.action)}</span><span>${tt(e.ts)}</span></div><div class="bb">${esc(e.message || e.status)}</div></div></div>`; }).join("")}</div>`;
}
function renderRight() {
  const rt = document.getElementById("rtitle"), rb = document.getElementById("rbody"), rc = document.getElementById("rclose");
  rc.style.display = view === "all" ? "none" : "";
  if (view === "all") { rt.textContent = "全部動態"; rb.innerHTML = chatLog(events); return; }
  const f = FLOORS[view]; rt.textContent = `${f.label}・${f.name}`;
  const ids = focusAgent ? [focusAgent, ...f.agents.filter((x) => x !== focusAgent)] : f.agents;
  const evs = events.filter((e) => f.agents.includes(e.agent) || f.agents.includes(e.to));
  rb.innerHTML = ids.map(profileCard).join("") + `<div class="sect" style="margin:14px 4px 8px">本樓層對話紀錄</div>` + chatLog(evs);
}
document.getElementById("rclose").addEventListener("click", () => setView("all"));
document.getElementById("follow").addEventListener("change", (e) => { follow = e.target.checked; if (!follow) followId = null; });
document.getElementById("menuBtn").addEventListener("click", () => { document.getElementById("right").classList.remove("open"); document.getElementById("left").classList.toggle("open"); });
document.getElementById("infoBtn").addEventListener("click", () => { document.getElementById("left").classList.remove("open"); document.getElementById("right").classList.toggle("open"); });
function renderAll() { updateCounts(); renderFloors(); renderLists(); renderRight(); redraw(hqScreen); }

/* ---------------- raycast clicks ---------------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  mouse.set((e.clientX / vw) * 2 - 1, -(e.clientY / vh) * 2 + 1); ray.setFromCamera(mouse, camera);
  const blobs = ORDER.map((id) => chars[id].blob); const hit = ray.intersectObjects(blobs, false)[0];
  if (hit) { const id = ORDER.find((k) => chars[k].blob === hit.object); return setView(AG[id].floor, id); }
  if (view === "all") { const vis = slabMeshes.filter((m) => fadeLevel[m.userData.floor] > 0.5); const h2 = ray.intersectObjects(vis, false)[0]; if (h2) setView(h2.object.userData.floor); }
});
addEventListener("keydown", (e) => { if (e.key === "Escape") setView("all"); });

/* ---------------- live data ---------------- */
function applyEvent(ev) {
  events.push(ev); if (events.length > 300) events.shift();
  if (ev.agent && AG[ev.agent]) { agentState[ev.agent] = Object.assign({}, agentState[ev.agent] || {}, { status: ev.status || ev.message, action: ev.action, updated: ev.ts }); }
  if ((ev.action === "handoff" || ev.action === "walk_to") && ev.to && AG[ev.to] && ev.to !== ev.agent && chars[ev.agent] && !chars[ev.agent].traveling) planTrip(ev.agent, ev.to, ev.action);
  renderAll();
}
function applySnapshot(st) {
  if (st.agents) for (const [id, a] of Object.entries(st.agents)) agentState[id] = Object.assign({}, a);
  if (Array.isArray(st.events)) events = st.events.slice(-300);
  renderAll();
}
const connEl = document.getElementById("conn"), connTx = document.getElementById("connTx");
function setConn(k) { connEl.className = k; connTx.textContent = k === "live" ? "即時連線" : k === "off" ? "重新連線中…" : "連線中…"; }
function connect() {
  let es; try { es = new EventSource("/events/stream"); } catch { setConn("off"); return setTimeout(connect, 4000); }
  es.addEventListener("open", () => setConn("live"));
  es.addEventListener("init", (m) => { try { applySnapshot(JSON.parse(m.data)); setConn("live"); } catch {} });
  es.addEventListener("event", (m) => { try { const d = JSON.parse(m.data); const ev = d.event || d; if (d.agent && d.agent.id) agentState[d.agent.id] = Object.assign({}, agentState[d.agent.id], d.agent); applyEvent(ev); } catch {} });
  es.addEventListener("error", () => { setConn("off"); if (es.readyState === 2) setTimeout(connect, 4000); });
}
fetch("/api/state").then((r) => r.json()).then(applySnapshot).catch(() => {});
connect();
window.__office = { chars, agentState, get events() { return events; }, setView, planTrip, applyEvent, camera, scene };

/* ---------------- start ---------------- */
const pf = params.get("floor");
if (pf != null && pf !== "all" && !isNaN(+pf) && +pf >= 0 && +pf < NFLOORS) setView(+pf, null, true); else setView("all", null, true);
document.getElementById("loading").remove();
renderAll();
requestAnimationFrame(animate);
setInterval(() => { updateCounts(); renderFloors(); }, 3000);
</script>
</body>
</html>
